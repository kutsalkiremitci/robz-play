<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Robz Play sosyal önizleme</title>
<!--
  GitHub'ın "Social preview" görseli (1280x640). PNG'ye çevirmek için:
  msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640
         --screenshot=sosyal-onizleme.png sosyal-onizleme.html
-->
<style>
  :root {
    --bg: #141110;
    --text: #FAF9F5;
    --muted: #C2C0B6;
    --faint: #8F8D85;
    --accent: #D97757;
    --line: #3A3936;
    --display: "Segoe UI Black", "Segoe UI", Arial, sans-serif;
    --letter: linear-gradient(100deg, #FFF7EE 0%, #F5C7A6 42%, #E4845E 75%, #C85A35 100%);
    --button: linear-gradient(100deg, #FCE6D3 0%, #F2B48F 48%, #E4845E 100%);
    --rim: 0 0 0 2px #110E0D, 0 0 0 4px rgba(233, 153, 122, 0.85);
    --sans: "Segoe UI", system-ui, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  .card {
    position: relative; width: 1280px; height: 640px; overflow: hidden;
    background:
      radial-gradient(620px 420px at 18% 100%, rgba(217, 119, 87, 0.26), transparent 70%),
      linear-gradient(180deg, #1B1514, #100D0C);
    color: var(--text); font-family: var(--sans);
  }

  /* sağda oyun görüntüsü, sola doğru karanlığa karışır */
  .shot {
    position: absolute; top: 0; right: 0; width: 780px; height: 640px;
    background: url("../gta-vi-60fps.jpg") 38% 50% / cover no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 46%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 46%);
  }
  .shot::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(18, 17, 16, 0.85) 0%, rgba(18, 17, 16, 0.35) 34%, rgba(18, 17, 16, 0) 56%),
      linear-gradient(0deg, rgba(18, 17, 16, 0.5) 0%, rgba(18, 17, 16, 0) 26%);
  }


  .floor {
    position: absolute; left: -40%; width: 120%; bottom: 0; height: 230px;
    background:
      repeating-linear-gradient(90deg, rgba(228, 132, 94, 0.26) 0 1.5px, transparent 1.5px 70px),
      repeating-linear-gradient(0deg, rgba(228, 132, 94, 0.26) 0 1.5px, transparent 1.5px 28px);
    transform: perspective(300px) rotateX(58deg); transform-origin: center bottom;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
    mask-image: linear-gradient(to top, #000 10%, transparent 90%);
  }

  .content { position: absolute; left: 72px; top: 60px; width: 660px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 78px; height: 78px; flex: none; }
  .brand b { font: italic 900 44px/1 var(--display); letter-spacing: -0.5px; }

  h1 { margin-top: 40px; font: italic 900 70px/1.08 var(--display); letter-spacing: -1px; }
  h1 em {
    display: block; width: fit-content; padding-right: 0.12em;
    background: var(--letter); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(217, 119, 87, 0.4));
  }
  .lead { margin-top: 26px; font-size: 27px; line-height: 1.4; color: var(--muted); }
  .lead strong { color: var(--text); font-weight: 600; }

  .chips { margin-top: 34px; display: flex; gap: 12px; }
  .chips span {
    font-size: 21px; font-weight: 600; color: var(--text);
    padding: 9px 16px; border-radius: 999px;
    background: rgba(38, 38, 36, 0.92); border: 1px solid var(--line);
  }
  .chips span.hot {
    background: var(--button); color: #1A110D; border-color: transparent; box-shadow: var(--rim);
    font-family: var(--display); font-style: italic; font-weight: 900;
  }

  .repo {
    position: absolute; left: 72px; bottom: 42px;
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; color: var(--faint);
  }
  .repo svg { width: 26px; height: 26px; color: var(--muted); }

  /* uygulamadaki FPS sayacının büyütülmüş hali */
  .fps {
    position: absolute; right: 56px; top: 56px;
    padding: 18px 26px 16px; border-radius: 18px;
    background: rgba(20, 17, 16, 0.82); border: 2px solid rgba(233, 153, 122, 0.55);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    text-align: left;
  }
  .fps b {
    display: block; width: fit-content; padding-right: 0.1em;
    font: italic 900 64px/1 var(--display); letter-spacing: -1px;
    background: var(--letter); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .fps small { display: block; margin-top: 8px; font-size: 21px; color: var(--muted); }
  .fps small i { font-style: normal; color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="shot"></div>
  <div class="floor"></div>

  <div class="content">
    <div class="brand">
      <img src="../logo/robzplay-ikon.svg" alt="">
      <b>Robz Play</b>
    </div>

    <h1>PS5'te 30 FPS.<em>Ekranında 60 FPS.</em></h1>
    <p class="lead"><strong>GTA VI için tasarlandı.</strong> PS5 Remote Play,<br>aradaki kareleri ekran kartın üretir.</p>

    <div class="chips">
      <span class="hot">1080p · 60 FPS</span>
      <span>Capture card yok</span>
      <span>Ücretsiz</span>
    </div>
  </div>

  <div class="repo">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    github.com/kutsalkiremitci/robz-play
  </div>

  <div class="fps"><b>60 FPS</b><small>PS5'ten gelen: <i>30</i></small></div>
</div>
</body>
</html>
